name: Build modpack

on:
  push:
    branches: [main]
    paths: ["pack/**"]
  workflow_dispatch:

permissions:
  contents: write

concurrency:
  group: build-pack
  cancel-in-progress: true

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-go@v5
        with:
          go-version: stable

      - name: Install packwiz
        run: go install github.com/packwiz/packwiz@latest

      - name: Refresh index (commit it if it changed)
        working-directory: pack
        run: |
          packwiz refresh
          if [ -n "$(git status --porcelain .)" ]; then
            git config user.name "github-actions[bot]"
            git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
            git add -A .
            git commit -m "chore: refresh packwiz index"
            git push
          fi

      - name: Export .mrpack (Prism, Modrinth app, etc.)
        working-directory: pack
        run: |
          packwiz modrinth export
          mkdir -p ../dist
          cp ./*.mrpack ../dist/
          cp ./*.mrpack ../dist/modpack.mrpack

      - name: Publish rolling "latest" release
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          VERSION=$(sed -n 's/^version = "\(.*\)"/\1/p' pack/pack.toml | head -1)
          gh release delete latest --cleanup-tag -y || true
          gh release create latest dist/*.mrpack \
            --title "Latest modpack (v${VERSION})" \
            --notes "Built from ${GITHUB_SHA}. Import modpack.mrpack into Prism Launcher."
