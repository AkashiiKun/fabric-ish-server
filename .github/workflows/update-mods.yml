name: Weekly mod updates

on:
  schedule:
    - cron: "0 6 * * 1"
  workflow_dispatch:

permissions:
  contents: write
  pull-requests: write

jobs:
  update:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-go@v5
        with:
          go-version: stable
      - run: go install github.com/packwiz/packwiz@latest
      - name: Update all mods
        working-directory: pack
        run: |
          packwiz update --all -y
          packwiz refresh
      - uses: peter-evans/create-pull-request@v7
        with:
          branch: auto/mod-updates
          title: "Update mods"
          commit-message: "chore: update mods"
          body: "Automated `packwiz update --all`. Merge to roll the update out to the server and rebuild the modpack."
