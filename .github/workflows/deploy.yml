name: deploy

on:
  push:
    branches:
      - main

jobs:
  build:
    runs-on: ubuntu-24.04
    permissions:
      contents: write
    steps:
      - name: Checkout
        uses: actions/checkout@v6.0.1
      - name: Validate Gradle Wrapper
        uses: gradle/actions/wrapper-validation@v5.0.0
      - name: Set up Java
        uses: actions/setup-java@v5.1.0
        with:
          distribution: 'temurin'
          java-version: 25
      - name: Setup Go
        uses: actions/setup-go@v6.1.0
        with:
          go-version: '1.25.5'
      - name: Install Packwiz
        run: go install github.com/packwiz/packwiz@52b12301
      - name: Build
        run: |
          chmod +x ./build.sh
          ./build.sh
      - name: Upload Artifacts
        uses: actions/upload-artifact@v5.0.0
        with:
          name: artifacts
          path: out
      - name: Publish rolling "latest" release
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          VERSION=$(sed -n 's/^version = "\(.*\)"/\1/p' pack.toml | head -1)
          cp out/holiday-server-pack.mrpack out/modpack.mrpack
          gh release delete latest --cleanup-tag -y || true
          gh release create latest out/modpack.mrpack \
            --title "Latest modpack (v${VERSION})" \
            --notes "Built from ${GITHUB_SHA}. Import modpack.mrpack into Prism Launcher."
      - name: Upload Pages Artifacts
        uses: actions/upload-pages-artifact@v4.0.0
        id: deployment
        with:
          path: build
  deploy:
    needs: build
    permissions:
      pages: write
      id-token: write
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    runs-on: ubuntu-latest
    steps:
      - name: Deploy
        id: deployment
        uses: actions/deploy-pages@v4.0.5