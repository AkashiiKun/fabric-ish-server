# BlueMap core config. Defaults for everything not set here are generated on first start.

# You must accept Mojang's EULA-style download of the Minecraft client resources
# (BlueMap downloads the client jar to render textures).
accept-download: true

# Folder (relative to the server root) where rendered map data is stored.
data: "bluemap"

# Threads used for rendering. Keep low on a shared host.
render-thread-count: 2

# Also read textures/models from other installed mods.
scan-for-mod-resources: true

# Anonymous usage statistics.
metrics: false
